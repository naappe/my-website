name: Build PhoneDesk v0.2 APK

on:
  push:
    branches: [ build/phonedesk-v02 ]
    paths:
      - 'phonedesk-android/**'
      - '.github/workflows/phonedesk-v02.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-37" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build debug APK
        working-directory: phonedesk-android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Upload PhoneDesk APK
        uses: actions/upload-artifact@v4
        with:
          name: phonedesk-v0.2-dev1-apk
          path: phonedesk-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
