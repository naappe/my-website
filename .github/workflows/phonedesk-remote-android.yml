name: Test PhoneDesk Remote Android

on:
  push:
    branches: [ build/phonedesk-remote-v1 ]
    paths:
      - 'phonedesk-android/**'
      - '.github/workflows/phonedesk-remote-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build Remote Mode debug APK
        working-directory: phonedesk-android
        run: gradle testDebugUnitTest assembleDebug --stacktrace
