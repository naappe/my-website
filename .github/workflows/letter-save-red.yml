name: Letter Save Edit Implementation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  implement-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch saved-letter behavior
        run: python .github/scripts/patch_letter_save.py

      - name: Verify patch is idempotent
        run: python .github/scripts/patch_letter_save.py

      - name: Run saved-letter regression checks
        run: python .github/scripts/test_letter_save.py

      - name: Check inline JavaScript syntax
        run: node --check /tmp/letters-inline.js

      - name: Commit implementation to PR branch
        run: |
          git rm -f .github/letter-save-impl-trigger.txt 2>/dev/null || true
          if git diff --quiet -- letters/index.html .github/letter-save-impl-trigger.txt; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add letters/index.html
          git add -u .github/letter-save-impl-trigger.txt 2>/dev/null || true
          git commit -m "Fix duplicate letter saves and streamline editing"
          git push origin HEAD:${{ github.head_ref }}
