<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Workspace</title><style>
:root{--n:#14213d;--b:#315de6;--bg:#f5f7fb;--l:#e1e6ef;--m:#667085;--g:#087c59;--r:#c33232}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#182230;font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}.top{background:var(--n);color:#fff;padding:18px max(18px,calc((100% - 1120px)/2));display:flex;justify-content:space-between}.brand{font-size:20px;font-weight:800}.brand i{color:#9db8ff;font-style:normal}.nav{background:#20335d;display:flex;overflow:auto;padding:0 max(12px,calc((100% - 1120px)/2))}.nav button{border:0;background:transparent;color:#d7e1fa;padding:13px 15px;white-space:nowrap}.nav .on{background:#fff;color:var(--n);font-weight:800;border-radius:9px 9px 0 0}.main{max-width:1120px;margin:auto;padding:28px 17px 60px}.page{display:none}.page.on{display:block}h1{margin:0;font-size:26px}h2{margin:0 0 5px;font-size:17px}p{color:var(--m)}.cards,.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stats{grid-template-columns:repeat(3,1fr);margin-top:22px}.card,.panel,.stat{background:#fff;border:1px solid var(--l);border-radius:15px;padding:18px}.card{cursor:pointer;transition:.15s}.card:hover{transform:translateY(-2px);box-shadow:0 9px 20px #14213d13}.card strong{display:block;font-size:16px;margin:10px 0 3px}.stat small{color:var(--m)}.stat b{display:block;font-size:24px;margin-top:7px}.grid{display:grid;grid-template-columns:370px 1fr;gap:17px}.form{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:9px}label{font-size:11px;font-weight:800;color:#475467;display:grid;gap:5px}input,select,textarea{border:1px solid #d7dee9;border-radius:9px;padding:10px;width:100%}.primary,.light,.danger{border:0;border-radius:9px;padding:10px 12px;font-weight:750}.primary{background:var(--b);color:#fff}.light{background:#edf2f8;color:#354254}.danger{background:#fff0f0;color:var(--r)}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:10px;text-align:left;border-bottom:1px solid #edf0f4}th{font-size:11px;color:var(--m)}.wrap{overflow:auto}.tag{padding:3px 7px;border:0;border-radius:99px;background:#eaf0ff;color:#315de6;font-size:11px;font-weight:800}.paid{background:#e5f8ef;color:var(--g)}.empty{text-align:center;color:#98a2b3;padding:35px}.tool{display:flex;gap:15px;align-items:center;max-width:650px}.tool a{text-decoration:none}@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.stats,.grid{grid-template-columns:1fr}.main{padding:20px 13px}.wrap table{min-width:570px}}
</style></head><body><header><div class="top"><div class="brand">My <i>Workspace</i></div><small id="date"></small></div><nav class="nav" id="nav"></nav></header><main class="main" id="main"></main><script>
const D={g:(k,d)=>{try{return JSON.parse(localStorage.getItem('mw3_'+k))??d}catch{return d}},s:(k,v)=>localStorage.setItem('mw3_'+k,JSON.stringify(v))};let S={sales:D.g('sales',[]),purchases:D.g('purchases',[]),products:D.g('products',[]),ot:D.g('ot',[]),expenses:D.g('expenses',[]),salary:D.g('salary',0),profile:D.g('profile',{})};const save=()=>Object.entries(S).forEach(x=>D.s(x[0],x[1]));const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),M=n=>'MVR '+(+n||0).toLocaleString('en-US',{minimumFractionDigits:2}),sum=(a,f)=>a.reduce((n,x)=>n+(f(x)||0),0),tot=x=>sum(x.items||[],i=>i.qty*i.rate);let pg='home';const tabs=[['home','Home'],['quo','Quo'],['bills','Bills'],['stock','Stock'],['ot','OT Record'],['letters','Letters'],['social','SocialMV'],['money','Money Plan'],['profile','Profile']];
function go(x){pg=x;nav();render();scrollTo(0,0)}function nav(){nav.innerHTML=tabs.map(x=>'<button class="'+(pg==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}function field(i,l,t='text',v='',p=''){return '<label>'+l+'<input id="'+i+'" type="'+t+'" value="'+v+'" placeholder="'+p+'"></label>'}function blank(x){return '<div class="empty">'+x+'</div>'}function remove(a,k){let n=a.findIndex(x=>x.id==k);if(n>-1){a.splice(n,1);save();render()}}
function card(i,t,p,x){return '<article class="card" onclick="go(\''+x+'\')"><div style="font-size:25px">'+i+'</div><strong>'+t+'</strong><p>'+p+'</p></article>'}function table(h,r){return r?'<div class="wrap"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r+'</tbody></table></div>':blank('No records yet.')}
function render(){date.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'});let open=sum(S.sales.filter(x=>x.type=='Invoice'&&!x.paid),tot),buy=sum(S.purchases,tot),hrs=sum(S.ot,x=>x.hours),value=sum(S.products,x=>x.stock*x.rate);let R={
home:()=>'<h1>Your work, connected.</h1><p>Purchases update Stock. Invoices update the Home summary.</p><div class="cards">'+card('💰','Quo','Create quotations and invoices.','quo')+card('🧾','Bills','Record purchases and suppliers.','bills')+card('📦','Stock','Check quantities and value.','stock')+card('⏱️','OT Record','Record work and hours.','ot')+card('✉️','Letters','Company document tools.','letters')+card('📰','SocialMV','Create social-news posts.','social')+card('🧮','Money Plan','Salary and expenses.','money')+card('👤','Profile','Your saved details.','profile')+'</div><div class="stats"><div class="stat"><small>Invoices outstanding</small><b style="color:var(--g)">'+M(open)+'</b></div><div class="stat"><small>Purchase bills total</small><b style="color:var(--r)">'+M(buy)+'</b></div><div class="stat"><small>OT hours logged</small><b style="color:var(--b)">'+hrs.toFixed(1)+' hrs</b></div></div>',
quo:()=>'<h1>Quo</h1><p>Create sales documents. Open invoices appear on Home.</p><div class="grid"><section class="panel"><h2>New document</h2><form class="form" onsubmit="sale(event)"><div class="two"><label>TYPE<select id="st"><option>Quotation</option><option>Proforma Invoice</option><option>Invoice</option><option>Receipt</option></select></label>'+field('sd','DATE','date',new Date().toISOString().slice(0,10))+'</div>'+field('sc','CUSTOMER','','','Customer name')+field('si','ITEM / SERVICE','','','Item or service')+'<div class="two">'+field('sq','QUANTITY','number','1')+field('sr','RATE (MVR)','number','','0.00')+'</div><button class="primary">Create document</button></form></section><section class="panel"><h2>Sales documents</h2>'+table(['NO.','TYPE','CUSTOMER','TOTAL','STATUS',''],S.sales.map(x=>'<tr><td>'+x.no+'</td><td><span class="tag">'+x.type+'</span></td><td>'+x.customer+'</td><td>'+M(tot(x))+'</td><td>'+(x.type=='Invoice'?'<button class="tag '+(x.paid?'paid':'')+'" onclick="pay(\''+x.id+'\')">'+(x.paid?'Paid':'Open')+'</button>':'—')+'</td><td><button class="danger" onclick="remove(S.sales,\''+x.id+'\')">Delete</button></td></tr>').join(''))+'</section></div>',
bills:()=>'<h1>Bills</h1><p>Each saved purchase automatically adds the quantity into Stock.</p><div class="grid"><section class="panel"><h2>New purchase bill</h2><form class="form" onsubmit="buy(event)">'+field('bs','SUPPLIER','','','Supplier name')+field('bp','PRODUCT','','','Product name')+'<div class="two">'+field('bu','UNIT','','pcs','kg, pcs, l')+field('bq','QUANTITY','number','1')+'</div><div class="two">'+field('br','RATE PER UNIT (MVR)','number','','0.00')+field('bd','DATE','date',new Date().toISOString().slice(0,10))+'</div><button class="primary">Save bill & update stock</button></form></section><section class="panel"><h2>Purchase bills</h2>'+table(['BILL','SUPPLIER','PRODUCT','QTY','TOTAL',''],S.purchases.map(x=>'<tr><td>'+x.no+'</td><td>'+x.supplier+'</td><td>'+x.items[0].name+'</td><td>'+x.items[0].qty+' '+x.items[0].unit+'</td><td>'+M(tot(x))+'</td><td><button class="danger" onclick="unbuy(\''+x.id+'\')">Delete</button></td></tr>').join(''))+'</section></div>',
stock:()=>'<h1>Stock</h1><p>Products are created from Bills. Correct stock when needed.</p><div class="stats"><div class="stat"><small>Products</small><b>'+S.products.length+'</b></div><div class="stat"><small>Low stock (2 or below)</small><b style="color:var(--r)">'+S.products.filter(x=>x.stock<=2).length+'</b></div><div class="stat"><small>Stock value</small><b style="color:var(--b)">'+M(value)+'</b></div></div><section class="panel" style="margin-top:18px">'+table(['PRODUCT','UNIT','LAST RATE','STOCK','VALUE',''],S.products.map(x=>'<tr><td><b>'+x.name+'</b></td><td>'+x.unit+'</td><td>'+M(x.rate)+'</td><td>'+x.stock+'</td><td>'+M(x.stock*x.rate)+'</td><td><button class="light" onclick="adjust(\''+x.id+'\')">Adjust</button></td></tr>').join(''))+'</section>',
ot:()=>'<h1>OT Work Record</h1><p>Save staff overtime and completed work.</p><div class="grid"><section class="panel"><h2>Add OT</h2><form class="form" onsubmit="addot(event)">'+field('od','DATE','date',new Date().toISOString().slice(0,10))+'<div class="two">'+field('oi','CHECK IN','time')+field('oo','CHECK OUT','time')+'</div>'+field('os','STAFF WHO JOINED','','','Naseeh, Shaheem...')+'<label>WORK COMPLETED<textarea id="ow" rows="4"></textarea></label><button class="primary">Save OT record</button></form></section><section class="panel"><h2>Saved OT records</h2>'+table(['DATE','TIME','STAFF','WORK','HOURS',''],S.ot.map(x=>'<tr><td>'+x.date+'</td><td>'+x.in+' – '+x.out+'</td><td>'+x.staff+'</td><td>'+x.work+'</td><td><b>'+x.hours.toFixed(1)+'</b></td><td><button class="danger" onclick="remove(S.ot,\''+x.id+'\')">Delete</button></td></tr>').join(''))+'</section></div>',
letters:()=>tool('✉️','White Saffron Letters','Transfer letters, appointment letters, Dhivehi letters, PDF and print tools.','letters/','Open Letter Workspace'),
social:()=>tool('📰','SocialMV News Studio','Upload a photo, edit Dhivehi text, adjust the design and download the post.','socialmv/','Open News Studio'),
money:()=>'<h1>My Money Plan</h1><p>Keep salary and personal expenses together.</p><div class="grid"><section class="panel"><form class="form" onsubmit="salary(event)">'+field('ms','MONTHLY SALARY (MVR)','number',S.salary)+'<button class="light">Save salary</button></form><hr style="border:0;border-top:1px solid var(--l);margin:18px 0"><form class="form" onsubmit="expense(event)">'+field('en','EXPENSE NAME','','','Electricity, food, credit')+'<div class="two">'+field('ea','AMOUNT (MVR)','number')+field('ed','DUE DATE','date')+'</div><button class="primary">Add expense</button></form></section><section class="panel"><h2>Expenses</h2><p>Salary: '+M(S.salary)+' · unpaid: '+M(sum(S.expenses.filter(x=>!x.paid),x=>x.amount))+'</p>'+table(['EXPENSE','AMOUNT','DUE','STATUS',''],S.expenses.map(x=>'<tr><td>'+x.name+'</td><td>'+M(x.amount)+'</td><td>'+x.due+'</td><td><button class="tag '+(x.paid?'paid':'')+'" onclick="epay(\''+x.id+'\')">'+(x.paid?'Paid':'Unpaid')+'</button></td><td><button class="danger" onclick="remove(S.expenses,\''+x.id+'\')">Delete</button></td></tr>').join(''))+'</section></div>',
profile:()=>'<h1>Profile</h1><p>Personal information saved in this workspace.</p><section class="panel" style="max-width:650px"><form class="form" onsubmit="profile(event)"><div class="two">'+field('pn','FULL NAME','text',S.profile.name||'')+field('pr','ROLE / TITLE','text',S.profile.role||'')+'</div><div class="two">'+field('pp','PHONE','text',S.profile.phone||'')+field('pe','EMAIL','email',S.profile.email||'')+'</div><label>ABOUT<textarea id="pa" rows="5">'+(S.profile.about||'')+'</textarea></label><button class="primary">Save profile</button></form></section>'};main.innerHTML='<section class="page on">'+R[pg]()+'</section>'}
function tool(i,t,p,u,b){return '<h1>'+t+'</h1><p>'+p+'</p><div class="panel tool"><div style="font-size:34px">'+i+'</div><div><b>'+t+'</b><p>Use the full editor here.</p><a class="primary" href="'+u+'">'+b+' →</a></div></div>'}function sale(e){e.preventDefault();let a=si.value.trim(),c=sc.value.trim();if(!a||!c)return alert('Enter customer and item.');S.sales.unshift({id:id(),no:'DOC-'+(1001+S.sales.length),type:st.value,customer:c,date:sd.value,items:[{name:a,qty:+sq.value||1,rate:+sr.value||0}],paid:false});save();render()}function pay(k){let x=S.sales.find(x=>x.id==k);x.paid=!x.paid;save();render()}function buy(e){e.preventDefault();let n=bp.value.trim(),s=bs.value.trim();if(!n||!s)return alert('Enter supplier and product.');let it={name:n,unit:bu.value||'pcs',qty:+bq.value||1,rate:+br.value||0},p=S.products.find(x=>x.name.toLowerCase()==n.toLowerCase());if(p){p.stock+=it.qty;p.rate=it.rate}else S.products.push({id:id(),name:n,unit:it.unit,rate:it.rate,stock:it.qty});S.purchases.unshift({id:id(),no:'BILL-'+(1001+S.purchases.length),supplier:s,date:bd.value,items:[it]});save();render()}function unbuy(k){let x=S.purchases.find(x=>x.id==k),p=S.products.find(p=>p.name==x.items[0].name);if(p)p.stock=Math.max(0,p.stock-x.items[0].qty);remove(S.purchases,k)}function adjust(k){let x=S.products.find(x=>x.id==k),v=prompt('Set stock for '+x.name,x.stock);if(v!==null&&!isNaN(v)){x.stock=+v;save();render()}}function addot(e){e.preventDefault();let h=(new Date('2000-01-01T'+oo.value)-new Date('2000-01-01T'+oi.value))/36e5;if(!oi.value||!oo.value)return alert('Enter both times.');if(h<0)h+=24;S.ot.unshift({id:id(),date:od.value,in:oi.value,out:oo.value,staff:os.value,work:ow.value,hours:h});save();render()}function salary(e){e.preventDefault();S.salary=+ms.value||0;save();render()}function expense(e){e.preventDefault();if(!en.value.trim())return;S.expenses.unshift({id:id(),name:en.value,amount:+ea.value||0,due:ed.value,paid:false});save();render()}function epay(k){let x=S.expenses.find(x=>x.id==k);x.paid=!x.paid;save();render()}function profile(e){e.preventDefault();S.profile={name:pn.value,role:pr.value,phone:pp.value,email:pe.value,about:pa.value};save();alert('Profile saved.')}nav();render();
</script></body></html>
