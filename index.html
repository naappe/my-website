<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>StockFlow Dashboard</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    display: flex;
  }

  /* Sidebar */
  .sidebar {
    width: 220px;
    background: #111827;
    height: 100vh;
    padding: 20px;
  }

  .sidebar h2 {
    color: #38bdf8;
    font-size: 20px;
  }

  .sidebar a {
    display: block;
    color: #cbd5e1;
    padding: 10px 0;
    text-decoration: none;
  }

  .sidebar a:hover {
    color: white;
  }

  /* Main */
  .main {
    flex: 1;
    padding: 20px;
  }

  .title {
    font-size: 26px;
    margin-bottom: 20px;
  }

  /* Cards */
  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 15px;
  }

  .card {
    background: #1e293b;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  }

  .card h3 {
    margin: 0;
    font-size: 14px;
    color: #94a3b8;
  }

  .card p {
    font-size: 24px;
    margin-top: 10px;
    color: #38bdf8;
  }

  /* Alerts */
  .alert {
    margin-top: 20px;
    background: #7f1d1d;
    padding: 15px;
    border-radius: 10px;
  }

  .alert h4 {
    margin: 0 0 10px 0;
    color: #f87171;
  }

</style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
  <h2>📦 StockFlow</h2>
  <a href="index.html">Dashboard</a>
  <a href="stock.html">Inventory</a>
  <a href="admin.html">POS</a>
</div>

<!-- Main -->
<div class="main">

  <div class="title">Dashboard Overview</div>

  <div class="cards">
    <div class="card">
      <h3>Total Products</h3>
      <p id="products">0</p>
    </div>

    <div class="card">
      <h3>Total Stock</h3>
      <p id="stock">0</p>
    </div>

    <div class="card">
      <h3>Low Stock Items</h3>
      <p id="lowstock">0</p>
    </div>

    <div class="card">
      <h3>Total Sales</h3>
      <p id="sales">0</p>
    </div>
  </div>

  <div class="alert" id="alertBox" style="display:none;">
    <h4>⚠ Low Stock Alert</h4>
    <div id="alertList"></div>
  </div>

</div>

<script>
async function loadDashboard() {
  const res = await fetch("/api/dashboard");
  const data = await res.json();

  document.getElementById("products").innerText = data.totalProducts;
  document.getElementById("stock").innerText = data.totalStock;
  document.getElementById("lowstock").innerText = data.lowStock.length;
  document.getElementById("sales").innerText = data.sales;

  // LOW STOCK ALERT UI
  if (data.lowStock.length > 0) {
    document.getElementById("alertBox").style.display = "block";

    document.getElementById("alertList").innerHTML =
      data.lowStock.map(p =>
        `<div>⚠ ${p.name} (Stock: ${p.stock})</div>`
      ).join("");
  }
}

loadDashboard();
</script>

</body>
</html>
