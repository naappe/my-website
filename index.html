<!DOCTYPE html>
<html>
<head>
    <title>Stock System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            flex: 1;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #3498db;
        }
        
        table {
            width: 100%;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        th {
            background: #34495e;
            color: white;
        }
        
        .low-stock {
            background: #ffe6e6;
            color: red;
            font-weight: bold;
        }
        
        .nav-links {
            text-align: center;
            margin-top: 20px;
        }
        
        .nav-links a {
            display: inline-block;
            margin: 5px;
            padding: 10px 20px;
            background: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }
        
        @media (max-width: 768px) {
            th, td {
                padding: 8px;
                font-size: 12px;
            }
            .stats {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Loading...</h1>
        
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalItems">0</div>
                <div>Total Products</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalStock">0</div>
                <div>Total Units</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lowStockCount">0</div>
                <div>Low Stock Items</div>
            </div>
        </div>
        
        <table>
            <thead>
                <tr><th>Product</th><th>Stock</th><th>Status</th></tr>
            </thead>
            <tbody id="stockTable"></tbody>
        </table>
        
        <div class="nav-links">
            <a href="/admin-login.html">🔐 Admin Login</a>
        </div>
    </div>
    
    <script>
        let products = [];
        
        async function loadData() {
            try {
                const response = await fetch('/api/stock/get');
                const data = await response.json();
                if(data.success) {
                    products = data.products;
                    renderTable();
                    updateStats();
                }
            } catch(e) {
                console.log('Error loading data');
            }
            
            // Load title
            try {
                const contentRes = await fetch('/api/content');
                const content = await contentRes.json();
                document.getElementById('title').innerHTML = content.title;
            } catch(e) {}
        }
        
        function renderTable() {
            const tbody = document.getElementById('stockTable');
            tbody.innerHTML = '';
            
            if(products.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center">No products yet</td></tr>';
                return;
            }
            
            products.forEach(p => {
                const row = tbody.insertRow();
                const isLow = p.stock <= p.minStock;
                if(isLow) row.className = 'low-stock';
                
                row.insertCell(0).innerHTML = p.name;
                row.insertCell(1).innerHTML = `<strong>${p.stock}</strong>`;
                row.insertCell(2).innerHTML = isLow ? '⚠️ LOW STOCK' : '✅ In Stock';
            });
        }
        
        function updateStats() {
            document.getElementById('totalItems').innerHTML = products.length;
            const totalStock = products.reduce((sum, p) => sum + p.stock, 0);
            document.getElementById('totalStock').innerHTML = totalStock;
            const lowStock = products.filter(p => p.stock <= p.minStock).length;
            document.getElementById('lowStockCount').innerHTML = lowStock;
        }
        
        loadData();
        // Refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
