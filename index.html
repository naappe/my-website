<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f2ec">
  <title>Inbox & Agenda</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="web/style.css">
</head>
<body>
  <header>
    <div><small>TODAY</small><h1>Inbox &amp; Agenda</h1><p id="date"></p></div>
    <button id="notify" class="quiet">Enable notifications</button>
  </header>
  <main>
    <section class="hero">
      <div><span class="eyebrow">YOUR DAY</span><h2>Mail and meetings,<br>in one calm view.</h2></div>
      <button id="connect">Connect Google</button>
    </section>
    <div id="setup" class="notice">Add your Google Web OAuth client ID in <code>web/config.js</code> to connect your private Gmail and Calendar.</div>
    <div class="columns">
      <section><div class="section-head"><h3>Upcoming</h3><span id="eventCount">0 events</span></div><div id="events" class="stack"></div></section>
      <section><div class="section-head"><h3>Inbox</h3><span id="mailCount">0 messages</span></div><div id="mail" class="stack"></div></section>
    </div>
  </main>
  <nav><button data-view="all" class="active">Today</button><button data-view="events">Calendar</button><button data-view="mail">Inbox</button></nav>
  <script src="web/config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="web/app.js"></script>
</body>
</html>
