<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title id="pageTitle">My Website</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style id="dynamicStyles">
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s;
        }
        
        .navbar {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }
        
        .nav-links {
            display: flex;
            gap: 1rem;
        }
        
        .nav-links a {
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: all 0.3s;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .hero {
            padding: 3rem;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .hero p {
            font-size: 1.2rem;
            line-height: 1.6;
        }
        
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .card {
            padding: 2rem;
            border-radius: 15px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            background: white;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .card-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        
        .card h3 {
            margin-bottom: 1rem;
        }
        
        .card p {
            line-height: 1.5;
            margin-bottom: 1rem;
        }
        
        .card button {
            padding: 0.5rem 1.5rem;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .card button:hover {
            opacity: 0.8;
        }
        
        .footer {
            text-align: center;
            padding: 2rem;
            margin-top: 3rem;
        }
        
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .container {
                padding: 1rem;
            }
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body id="appBody">
    <div id="customHeader"></div>
    
    <nav id="navbar" class="navbar">
        <div class="logo">✨ MyBrand</div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/stock.html">Stock</a>
            <a href="/admin.html">Admin</a>
            <a href="/design-admin.html">Design</a>
        </div>
    </nav>
    
    <div class="container">
        <div id="heroSection" class="hero">
            <h1 id="title">Loading...</h1>
            <p id="message">Loading...</p>
        </div>
        
        <div id="cardsSection" class="cards"></div>
    </div>
    
    <div id="customFooter"></div>
    <footer id="footer" class="footer">
        <p>&copy; 2024 MyBrand. All rights reserved.</p>
    </footer>
    
    <script>
        let designSettings = {};
        let contentData = {};
        
        async function loadEverything() {
            try {
                const [designRes, contentRes] = await Promise.all([
                    fetch('/api/design/get'),
                    fetch('/api/content')
                ]);
                const design = await designRes.json();
                const content = await contentRes.json();
                designSettings = design.settings;
                contentData = content;
                applyDesign();
            } catch(e) {
                console.log('Error loading data');
            }
        }
        
        function applyDesign() {
            // Apply colors
            document.body.style.backgroundColor = designSettings.backgroundColor;
            document.body.style.color = designSettings.textColor;
            
            // Generate dynamic CSS
            let styleText = `
                body { background: ${designSettings.backgroundColor}; color: ${designSettings.textColor}; }
                .navbar { background: ${designSettings.primaryColor}; }
                .navbar a { color: white; }
                .navbar a:hover { background: rgba(255,255,255,0.2); }
                .logo { color: white; }
                .hero { background: white; }
                .hero h1 { color: ${designSettings.headingColor}; }
                .hero p { color: ${designSettings.textColor}; }
                .card button { background: ${designSettings.primaryColor}; color: white; }
                .footer { background: ${designSettings.headingColor}; color: white; }
            `;
            
            // Layout style overrides
            if(designSettings.layoutStyle === 'dark') {
                styleText += `
                    .hero { background: #2c3e50; }
                    .hero h1 { color: white; }
                    .hero p { color: #ddd; }
                    .card { background: #34495e; color: white; }
                    .card h3 { color: white; }
                    .card p { color: #ddd; }
                `;
            }
            
            if(designSettings.layoutStyle === 'classic') {
                styleText += `
                    body { background: white; }
                    .hero { background: #f8f9fa; }
                `;
            }
            
            styleText += designSettings.customCSS || '';
            document.getElementById('dynamicStyles').innerHTML = styleText;
            
            // Show/hide sections
            const navbar = document.getElementById('navbar');
            const heroSection = document.getElementById('heroSection');
            const cardsSection = document.getElementById('cardsSection');
            const footer = document.getElementById('footer');
            
            if(navbar) navbar.style.display = designSettings.showNavbar ? 'flex' : 'none';
            if(heroSection) heroSection.style.display = designSettings.showHeroSection ? 'block' : 'none';
            if(cardsSection) cardsSection.style.display = designSettings.showCardsSection ? 'grid' : 'none';
            if(footer) footer.style.display = designSettings.showFooter ? 'block' : 'none';
            
            // Custom HTML
            const customHeaderDiv = document.getElementById('customHeader');
            const customFooterDiv = document.getElementById('customFooter');
            if(customHeaderDiv) customHeaderDiv.innerHTML = designSettings.customHeader || '';
            if(customFooterDiv) customFooterDiv.innerHTML = designSettings.customFooter || '';
            
            // Set content
            const titleElem = document.getElementById('title');
            const messageElem = document.getElementById('message');
            const pageTitleElem = document.getElementById('pageTitle');
            
            if(titleElem) titleElem.innerHTML = contentData.title;
            if(messageElem) messageElem.innerHTML = contentData.message;
            if(pageTitleElem) pageTitleElem.innerHTML = contentData.title;
            
            // Render cards
            const cardsHtml = `
                <div class="card">
                    <div class="card-icon">📦</div>
                    <h3>${designSettings.card1Title || 'Stock Management'}</h3>
                    <p>${designSettings.card1Text || 'Track inventory, manage stock in/out, and get low stock alerts.'}</p>
                    <button onclick="location.href='/stock.html'">Go →</button>
                </div>
                <div class="card">
                    <div class="card-icon">🔧</div>
                    <h3>${designSettings.card2Title || 'Admin Panel'}</h3>
                    <p>${designSettings.card2Text || 'Change website content, update messages, and manage settings.'}</p>
                    <button onclick="location.href='/admin.html'">Admin →</button>
                </div>
                <div class="card">
                    <div class="card-icon">🎨</div>
                    <h3>${designSettings.card3Title || 'Design Editor'}</h3>
                    <p>${designSettings.card3Text || 'Change colors, layout, and customize your website design.'}</p>
                    <button onclick="location.href='/design-admin.html'">Edit Design →</button>
                </div>
            `;
            
            const cardsSectionElem = document.getElementById('cardsSection');
            if(cardsSectionElem) cardsSectionElem.innerHTML = cardsHtml;
        }
        
        loadEverything();
    </script>
</body>
</html>
