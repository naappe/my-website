<!DOCTYPE html>
<html>
<head>
    <title>Design Editor - Admin Panel</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .container { max-width: 800px; margin: auto; }
        .section { background: white; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
        h1 { color: #333; }
        h2 { color: #666; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input[type="text"], input[type="color"], select, textarea {
            width: 100%; padding: 8px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 5px;
        }
        textarea { font-family: monospace; height: 100px; }
        button { background: #3498db; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
        .preview { background: white; padding: 20px; margin-top: 20px; border-radius: 10px; border: 2px dashed #ccc; }
        .status { background: green; color: white; padding: 10px; border-radius: 5px; margin-bottom: 10px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎨 Design Editor</h1>
    <p>Edit your website's design (colors, layout, custom code)</p>
    
    <div id="loginArea">
        <div class="section">
            <h2>Admin Login</h2>
            <input type="password" id="password" placeholder="Enter admin password">
            <button onclick="login()">Login to Edit Design</button>
            <p id="errorMsg" style="color:red"></p>
        </div>
    </div>
    
    <div id="editorArea" style="display:none;">
        <div id="status" class="status">Settings saved!</div>
        
        <div class="section">
            <h2>🎨 Colors</h2>
            <label>Primary Color (buttons, links):</label>
            <input type="color" id="primaryColor">
            <label>Background Color:</label>
            <input type="color" id="backgroundColor">
            <label>Text Color:</label>
            <input type="color" id="textColor">
            <label>Heading Color:</label>
            <input type="color" id="headingColor">
        </div>
        
        <div class="section">
            <h2>📐 Layout</h2>
            <label>Layout Style:</label>
            <select id="layoutStyle">
                <option value="modern">Modern (Gradient Background)</option>
                <option value="classic">Classic (Simple White)</option>
                <option value="dark">Dark Mode</option>
            </select>
            <label>
                <input type="checkbox" id="showNavbar"> Show Navigation Bar
            </label>
            <label>
                <input type="checkbox" id="showFooter"> Show Footer
            </label>
            <label>
                <input type="checkbox" id="showHeroSection"> Show Hero Section
            </label>
            <label>
                <input type="checkbox" id="showCardsSection"> Show Cards Section
            </label>
        </div>
        
        <div class="section">
            <h2>📝 Edit Card Content</h2>
            <label>Card 1 Title:</label>
            <input type="text" id="card1Title">
            <label>Card 1 Text:</label>
            <textarea id="card1Text"></textarea>
            
            <label>Card 2 Title:</label>
            <input type="text" id="card2Title">
            <label>Card 2 Text:</label>
            <textarea id="card2Text"></textarea>
            
            <label>Card 3 Title:</label>
            <input type="text" id="card3Title">
            <label>Card 3 Text:</label>
            <textarea id="card3Text"></textarea>
        </div>
        
        <div class="section">
            <h2>💻 Custom Code (Advanced)</h2>
            <label>Custom CSS (add your own styles):</label>
            <textarea id="customCSS" placeholder="/* Add your custom CSS here */
.button:hover {
  transform: scale(1.05);
}"></textarea>
            <label>Custom Header HTML:</label>
            <textarea id="customHeader" placeholder="<div>Anything you add here appears at top of page</div>"></textarea>
            <label>Custom Footer HTML:</label>
            <textarea id="customFooter" placeholder="<div>Copyright 2024 - My custom footer</div>"></textarea>
        </div>
        
        <button onclick="saveDesign()">💾 Save All Design Changes</button>
        
        <div class="preview">
            <h3>📱 Live Preview</h3>
            <p>Changes apply immediately after saving. <a href="/" target="_blank">View your live site →</a></p>
        </div>
    </div>
</div>

<script>
let currentPassword = '';

// Check if already logged in
if(localStorage.getItem('designLoggedIn') === 'yes') {
    document.getElementById('loginArea').style.display = 'none';
    document.getElementById('editorArea').style.display = 'block';
    loadDesign();
}

function login() {
    const password = document.getElementById('password').value;
    
    fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            currentPassword = password;
            localStorage.setItem('designLoggedIn', 'yes');
            document.getElementById('loginArea').style.display = 'none';
            document.getElementById('editorArea').style.display = 'block';
            loadDesign();
        } else {
            document.getElementById('errorMsg').innerText = 'Wrong password';
        }
    });
}

function loadDesign() {
    fetch('/api/design/get')
        .then(res => res.json())
        .then(data => {
            const s = data.settings;
            document.getElementById('primaryColor').value = s.primaryColor;
            document.getElementById('backgroundColor').value = s.backgroundColor;
            document.getElementById('textColor').value = s.textColor;
            document.getElementById('headingColor').value = s.headingColor;
            document.getElementById('layoutStyle').value = s.layoutStyle;
            document.getElementById('showNavbar').checked = s.showNavbar;
            document.getElementById('showFooter').checked = s.showFooter;
            document.getElementById('showHeroSection').checked = s.showHeroSection;
            document.getElementById('showCardsSection').checked = s.showCardsSection;
            document.getElementById('card1Title').value = s.card1Title;
            document.getElementById('card1Text').value = s.card1Text;
            document.getElementById('card2Title').value = s.card2Title;
            document.getElementById('card2Text').value = s.card2Text;
            document.getElementById('card3Title').value = s.card3Title;
            document.getElementById('card3Text').value = s.card3Text;
            document.getElementById('customCSS').value = s.customCSS || '';
            document.getElementById('customHeader').value = s.customHeader || '';
            document.getElementById('customFooter').value = s.customFooter || '';
        });
}

function saveDesign() {
    const settings = {
        primaryColor: document.getElementById('primaryColor').value,
        backgroundColor: document.getElementById('backgroundColor').value,
        textColor: document.getElementById('textColor').value,
        headingColor: document.getElementById('headingColor').value,
        layoutStyle: document.getElementById('layoutStyle').value,
        showNavbar: document.getElementById('showNavbar').checked,
        showFooter: document.getElementById('showFooter').checked,
        showHeroSection: document.getElementById('showHeroSection').checked,
        showCardsSection: document.getElementById('showCardsSection').checked,
        card1Title: document.getElementById('card1Title').value,
        card1Text: document.getElementById('card1Text').value,
        card2Title: document.getElementById('card2Title').value,
        card2Text: document.getElementById('card2Text').value,
        card3Title: document.getElementById('card3Title').value,
        card3Text: document.getElementById('card3Text').value,
        customCSS: document.getElementById('customCSS').value,
        customHeader: document.getElementById('customHeader').value,
        customFooter: document.getElementById('customFooter').value
    };
    
    fetch('/api/design/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: 'admin123', settings: settings })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            const status = document.getElementById('status');
            status.style.display = 'block';
            setTimeout(() => { status.style.display = 'none'; }, 2000);
        }
    });
}
</script>
</body>
</html>
