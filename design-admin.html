<!DOCTYPE html>
<html>
<head><title>Settings</title></head>
<body>

<h1>Settings</h1>

<button onclick="save()">Save Dark Theme</button>

<script>
async function save() {
  const res = await fetch("/design-settings.json");
  const data = await res.json();

  data.theme = "dark";

  await fetch("/design-settings.json", {
    method: "PUT",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  });

  alert("Saved");
}
</script>

</body>
</html>
